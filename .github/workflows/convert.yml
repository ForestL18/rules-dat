name: Convert Ruleset
on:
  workflow_dispatch:
  schedule:
    - cron: "30 23 * * *"

jobs:
  convert:
    runs-on: ubuntu-latest
    steps:
      - name: Set variables
        run: |
          echo "BUILDTIME=$(TZ=Asia/Shanghai date +'%Y-%m-%d %H:%M')" >> $GITHUB_ENV

      - name: Checkout Repo
        uses: actions/checkout@v4
        with:
          repository: ForestL18/rules-dat
          ref: mihomo
          path: rules
          sparse-checkout: |
            geo
          sparse-checkout-cone-mode: true

      - name: Checkout MetaCubeX Repo
        uses: actions/checkout@v4
        with:
          repository: MetaCubeX/meta-rules-dat
          ref: meta
          path: rules/metacubex
          sparse-checkout: |
            geo
          sparse-checkout-cone-mode: true

      - name: Download Convert Binary
        run: |
          mkdir -p ./convert
          wget 'https://github.com/ForestL18/meta-rules-converter/releases/download/Prerelease-beta/converter-linux-amd64' -O ./convert/converter
          chmod +x ./convert/converter

      - name: Convert MMDB files to ASN files
        run: |
          mkdir -p ./converted-rules/asn && mkdir -p ./convert/mmdb
          wget 'https://github.com/P3TERX/GeoLite.mmdb/raw/refs/heads/download/GeoLite2-ASN.mmdb' -O ./convert/mmdb/GeoLite2-ASN.mmdb
          ./convert/converter asn -f ./convert/mmdb/GeoLite2-ASN.mmdb -o ./converted-rules/asn/

      - name: Combine ASN files based on ASN lists
        run: |
          mkdir -p ./converted-rules/asn/combined && mkdir -p ./convert/list
          wget 'https://raw.githubusercontent.com/ForestL18/ASN/main/China-ASN.list' -O ./convert/list/China-ASN.list
          wget 'https://raw.githubusercontent.com/ForestL18/ASN/main/Generic-ASN/Telegram-ASN.list' -O ./convert/list/Telegram-ASN.list
          wget 'https://raw.githubusercontent.com/ForestL18/ASN/main/Generic-ASN/Google-ASN.list' -O ./convert/list/Google-ASN.list
          wget 'https://raw.githubusercontent.com/ForestL18/ASN/main/Generic-ASN/Netflix-ASN.list' -O ./convert/list/Netflix-ASN.list
          wget 'https://raw.githubusercontent.com/ForestL18/ASN/main/Generic-ASN/Twitter-ASN.list' -O ./convert/list/Twitter-ASN.list
          wget 'https://raw.githubusercontent.com/ForestL18/ASN/main/Generic-ASN/Facebook-ASN.list' -O ./convert/list/Facebook-ASN.list
          ./convert/converter combine -a ./convert/list/ -i ./converted-rules/asn/ -o ./converted-rules/asn/combined/

      - name: Convert DOMAIN files to MRS
        run: |
          mkdir -p ./converted-rules/geo/domain
          shopt -s nullglob
          cp rules/geo/domain/*.{list,yaml,yml} ./converted-rules/geo/domain
          ./convert/converter textfile -i ./rules/geo/domain/ -o ./converted-rules/geo/domain/ -b domain

      - name: Convert IPCIDR files to MRS
        run: |
          mkdir -p ./converted-rules/geo/ipcidr
          shopt -s nullglob
          cp rules/geo/ipcidr/*.{list,yaml,yml} ./converted-rules/geo/ipcidr
          ./convert/converter textfile -i ./rules/geo/ipcidr/ -o ./converted-rules/geo/ipcidr/ -b ipcidr

      - name: Commit and Push Changes
        run: |
          mkdir -p ./converted-rules/geo/classical
          mkdir -p ./converted-rules/geo/metacubex
          shopt -s nullglob
          cp rules/geo/classical/*.{list,yaml,yml} ./converted-rules/geo/classical/
          cp -r rules/metacubex/geo/geo* ./converted-rules/geo/metacubex/
          cd converted-rules
          git init
          git config --local user.name "github-actions[bot]"
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b mihomo
          git add .
          git commit -m "Released on ${{ env.BUILDTIME }}"
          git remote add origin "https://${{ github.actor }}:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}"
          git push -f -u origin mihomo
